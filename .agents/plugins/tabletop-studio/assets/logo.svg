<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="feltGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1b5e3c"/>
      <stop offset="100%" stop-color="#0c2b1b"/>
    </radialGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbf2"/>
      <stop offset="100%" stop-color="#eedfc2"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background circle / Tabletop felt -->
  <circle cx="64" cy="64" r="56" fill="url(#feltGrad)" stroke="#c29b53" stroke-width="4"/>
  <!-- Decorative felt inner ring -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#2e8555" stroke-dasharray="3,3" stroke-width="1.5"/>
  <!-- Okey Tile Body -->
  <rect x="36" y="26" width="56" height="76" rx="8" fill="url(#tileGrad)" filter="url(#tileShadow)" stroke="#d9c79e" stroke-width="2"/>
  <!-- Tile Number 101 -->
  <text x="64" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#b82525" text-anchor="middle" letter-spacing="-1">101</text>
  <!-- Tile Star Accent -->
  <polygon points="64,74 66.5,80 73,80.5 68,85 69.5,91 64,87.5 58.5,91 60,85 55,80.5 61.5,80" fill="#c29b53"/>
</svg>
